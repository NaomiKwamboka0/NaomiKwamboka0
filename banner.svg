<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Naomi Kwamboka. AI and Automation Engineer, Nairobi, Kenya. I build AI that shows its working.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a5c"/>
      <stop offset="0.55" stop-color="#0a0f38"/>
      <stop offset="1" stop-color="#05071c"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2d95" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff2d95" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="floorMask"><rect x="0" y="290" width="1280" height="110" fill="url(#floorFade)"/></mask>
    <clipPath id="frame"><rect width="1280" height="400" rx="22"/></clipPath>

    <!-- one isometric cube, drawn as top, left side and right side -->
    <g id="cubeBlue">
      <polygon points="0,-25 44,0 0,25 -44,0" fill="#6f9bff"/>
      <polygon points="-44,0 0,25 0,75 -44,50" fill="#2f6bff"/>
      <polygon points="44,0 0,25 0,75 44,50" fill="#1a3fc4"/>
    </g>
    <g id="cubePink">
      <polygon points="0,-25 44,0 0,25 -44,0" fill="#ff8cc6"/>
      <polygon points="-44,0 0,25 0,75 -44,50" fill="#ff2d95"/>
      <polygon points="44,0 0,25 0,75 44,50" fill="#c4126c"/>
    </g>
    <g id="cubeWhite">
      <polygon points="0,-25 44,0 0,25 -44,0" fill="#ffffff"/>
      <polygon points="-44,0 0,25 0,75 -44,50" fill="#d6dcfb"/>
      <polygon points="44,0 0,25 0,75 44,50" fill="#a4aee6"/>
    </g>
  </defs>

  <style>
    .t { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .name { font-size: 78px; font-weight: 800; letter-spacing: -1px; }
    .float  { animation: float 6s ease-in-out infinite; }
    .bob    { animation: bob 3.2s ease-in-out infinite; }
    .drift1 { animation: drift 7s ease-in-out infinite; }
    .drift2 { animation: drift 9s ease-in-out infinite reverse; }
    .drift3 { animation: drift 5.5s ease-in-out infinite; }
    .pulse  { animation: pulse 3.2s ease-in-out infinite; }
    .slide  { animation: slide 2.4s linear infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes bob   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
    @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(6px,-14px); } }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes slide { from { transform: translateY(0); } to { transform: translateY(22px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>

    <!-- soft light behind the cubes -->
    <ellipse cx="1010" cy="200" rx="330" ry="230" fill="url(#glowBlue)"/>
    <ellipse class="pulse" cx="1010" cy="120" rx="170" ry="130" fill="url(#glowPink)"/>

    <!-- 3D floor: lines run to one far point, so it looks deep -->
    <g mask="url(#floorMask)">
      <g stroke="#ff2d95" stroke-width="1.2" opacity="0.55">
        <path d="M640 250 L-600 400 M640 250 L-290 400 M640 250 L20 400 M640 250 L330 400 M640 250 L640 400 M640 250 L950 400 M640 250 L1260 400 M640 250 L1570 400 M640 250 L1880 400"/>
      </g>
      <g class="slide" stroke="#4f86ff" stroke-width="1.2" opacity="0.6">
        <path d="M0 292 H1280 M0 302 H1280 M0 316 H1280 M0 334 H1280 M0 356 H1280 M0 378 H1280 M0 400 H1280"/>
      </g>
    </g>

    <!-- the words. Three layers stacked a few pixels apart make the name look 3D -->
    <text class="t" x="72" y="92" font-size="26" font-weight="600" fill="#9fb4ff">Hi, I'm</text>
    <text class="t name" x="78" y="180" fill="#ff2d95">Naomi Kwamboka</text>
    <text class="t name" x="75" y="177" fill="#2f6bff">Naomi Kwamboka</text>
    <text class="t name" x="72" y="174" fill="#ffffff">Naomi Kwamboka</text>
    <text class="t" x="74" y="222" font-size="25" font-weight="600" fill="#d5dcff">AI and Automation Engineer · Nairobi, Kenya</text>
    <rect x="74" y="244" width="5" height="30" rx="2.5" fill="#ff2d95"/>
    <text class="t" x="92" y="267" font-size="23" font-weight="700" fill="#ff7dbd">I build AI that shows its working.</text>

    <!-- small cubes drifting in: messy data on its way to become clean -->
    <g class="drift1"><use xlink:href="#cubePink" href="#cubePink" transform="translate(830,120) scale(0.34) rotate(12)"/></g>
    <g class="drift2"><use xlink:href="#cubeWhite" href="#cubeWhite" transform="translate(872,236) scale(0.28) rotate(-18)"/></g>
    <g class="drift3"><use xlink:href="#cubeBlue" href="#cubeBlue" transform="translate(1178,96) scale(0.3) rotate(20)"/></g>
    <g class="drift2"><use xlink:href="#cubePink" href="#cubePink" transform="translate(1200,250) scale(0.24) rotate(-10)"/></g>
    <g class="drift1"><use xlink:href="#cubeWhite" href="#cubeWhite" transform="translate(790,196) scale(0.2) rotate(30)"/></g>

    <!-- the stack of cubes -->
    <g class="float">
      <ellipse cx="1010" cy="330" rx="150" ry="26" fill="#000" opacity="0.35"/>
      <g transform="translate(1010,215)">
        <!-- bottom layer, back to front -->
        <use xlink:href="#cubeBlue" href="#cubeBlue" transform="translate(0,0)"/>
        <use xlink:href="#cubeBlue" href="#cubeBlue" transform="translate(44,25)"/>
        <use xlink:href="#cubeWhite" href="#cubeWhite" transform="translate(-44,25)"/>
        <use xlink:href="#cubeBlue" href="#cubeBlue" transform="translate(0,50)"/>
        <!-- middle layer -->
        <use xlink:href="#cubeWhite" href="#cubeWhite" transform="translate(0,-50)"/>
        <use xlink:href="#cubeBlue" href="#cubeBlue" transform="translate(44,-25)"/>
        <!-- top cube floats above the rest -->
        <g class="bob"><use xlink:href="#cubePink" href="#cubePink" transform="translate(0,-122)"/></g>
      </g>
    </g>
  </g>
</svg>
